replicas: 1
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

persistence:
  enabled: true

volumeClaimTemplate:
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi

resources:
  requests:
    cpu: "500m"
    memory: "1536Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
